# Portail de clôture mensuelle — définition du bundle.
#
# Ce fichier reste COURT : chaque ressource (jobs, app, dashboard) vit dans son propre
# fichier sous resources/, inclus ci-dessous.

bundle:
  name: portail-cloture

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalogue Unity Catalog
    default: workspace
  schema:
    description: Schéma du projet (différent selon l'environnement)
  warehouse_id:
    description: SQL Warehouse utilisé par le dashboard (et plus tard par l'application)
    # « lookup » : la CLI cherche l'ID à partir du nom au moment du déploiement.
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-18ef0795-e41e.cloud.databricks.com
    variables:
      schema: cloture_dev

  # La cible "prod" sera ajoutée en phase 7, avec un service principal dédié.
